# sops-nix recipients + creation rules. Anyone listed here can decrypt the
# matching files.
#
# gabriel = YubiKey GPG key (PGP fingerprint):  gpg --card-status  /  gpg -K
# hosts   = host SSH key as age:  nix run nixpkgs#ssh-to-age -- < /etc/ssh/ssh_host_ed25519_key.pub
creation_rules:
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      # Personal editor identity (hardware-backed YubiKey).
      - pgp:
          - F393326D5513B802F281657767825262EAAF4EBE # gabriel
        # Unattended machine identities.
        age:
          - age16xxqf3dz6fshmwycq9t9tnztfwl6jw2afnnuu695pzvfl00apuzq584fcc # casper
          - age1aeryg4l2x6d99he6tw7ah3h3xcr4kqxdznr24mee6c30ftu2ff9qrxt67p # atlas
