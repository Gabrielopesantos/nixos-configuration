name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - run: nix flake check
      - run: nix build .#nixosConfigurations.casper.config.system.build.toplevel --no-link
      - run: nix build .#nixosConfigurations.atlas.config.system.build.toplevel --no-link
