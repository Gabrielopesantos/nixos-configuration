# Weekly flake.lock bump as a PR. Merging it is the human gate for updates:
# atlas auto-upgrades from main daily (system.autoUpgrade), so security
# patches reach it one merge after this PR opens.
name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/update-flake-lock@v24
        with:
          pr-title: "flake.lock: weekly update"
          pr-labels: dependencies
